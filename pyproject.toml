[build-system]
# Pinned below 1.27 deliberately: newer hatchling emits Metadata-Version 2.5,
# which current twine (6.2.0) rejects as invalid. 1.26 emits 2.3, which every
# upload path accepts. Revisit once the ecosystem catches up to 2.5.
requires = ["hatchling<1.27"]
build-backend = "hatchling.build"

[project]
name = "being-human"
version = "0.1.1"
description = "Learns your writing voice from your own prompt history, then makes the model write like that."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Omer" }]
keywords = ["writing", "voice", "style", "stylometry", "personalization", "mcp", "ai-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# No dependencies, deliberately. The whole tool is stdlib Python, so it installs
# anywhere a python3 binary exists and makes no network calls.
dependencies = []

[project.urls]
Homepage = "https://github.com/Syedomershah99/being-human"
Repository = "https://github.com/Syedomershah99/being-human"
Issues = "https://github.com/Syedomershah99/being-human/issues"

[project.scripts]
being-human = "being_human.cli:main"
being-human-mcp = "being_human.server:main"

[tool.hatch.build.targets.wheel]
packages = ["being_human"]

[tool.hatch.build.targets.sdist]
include = [
  "being_human",
  "skills",
  "commands",
  "hooks",
  "mcp",
  "scripts",
  "server.json",
  "README.md",
  "LICENSE",
]
